<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <rect width="64" height="64" rx="14" fill="#1f1913"/>
  <!-- chimney + smoke -->
  <rect x="40" y="12" width="6" height="12" fill="#8a5a3b"/>
  <rect x="42" y="6" width="4" height="4" fill="#cdb88f" opacity=".7"/>
  <rect x="46" y="2" width="3" height="3" fill="#cdb88f" opacity=".45"/>
  <!-- roof -->
  <polygon points="8,32 32,12 56,32" fill="#c9a227"/>
  <polygon points="14,32 32,17 50,32" fill="#e0b93a"/>
  <!-- walls -->
  <rect x="14" y="32" width="36" height="22" fill="#f6ead2"/>
  <!-- glowing hearth door -->
  <rect x="26" y="38" width="12" height="16" fill="#3a2f24"/>
  <rect x="28" y="44" width="8" height="8" fill="#ff8a3d"/>
  <rect x="30" y="46" width="4" height="5" fill="#ffd166"/>
  <!-- window -->
  <rect x="17" y="37" width="6" height="6" fill="#ffd166"/>
  <rect x="41" y="37" width="6" height="6" fill="#ffd166"/>
  <rect x="10" y="54" width="44" height="3" fill="#7fb069"/>
</svg>
